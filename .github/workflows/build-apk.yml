name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html','logo.png','icon.png','package.json','capacitor.config.json','.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          for f in index.html logo.png icon.png package.json capacitor.config.json; do [ -f "$f" ] || { echo "$f repo mein nahi hai"; exit 1; }; done
          mkdir www && cp index.html logo.png www/ && (cp logo-blue.png www/ 2>/dev/null || true)
          T=$(python3 -c "import json;print(json.load(open('data.json')).get('settings',{}).get('theme','green'))" 2>/dev/null || echo green)
          echo "THEME=$T" >> $GITHUB_ENV
          if [ "$T" = blue ] && [ -f icon-blue.png ]; then cp icon-blue.png icon.png; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Point app to live data
        run: sed -i "s#__DATA_URL__#https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data.json#" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: App icon from icon.png
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install -q --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          im=Image.open("icon.png").convert("RGB")
          res="android/app/src/main/res"
          for d,s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              im.resize((s,s),Image.LANCZOS).save(f"{res}/mipmap-{d}/ic_launcher.png")
              r=Image.new("RGBA",(s,s),(74,43,224,255))
              k=int(s*.8)
              r.paste(im.resize((k,k),Image.LANCZOS),((s-k)//2,(s-k)//2))
              m=Image.new("L",(s,s),0)
              ImageDraw.Draw(m).ellipse((0,0,s-1,s-1),fill=255)
              r.putalpha(m)
              r.save(f"{res}/mipmap-{d}/ic_launcher_round.png")
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Splash screen (plain white, no logo)
        run: |
          python3 - <<'PY'
          import glob,os,re
          from PIL import Image
          res="android/app/src/main/res"
          blue=os.environ.get("THEME")=="blue";col=(11,61,145) if blue else (255,255,255);hexc="#0B3D91" if blue else "#FFFFFF"
          for f in glob.glob(res+"/drawable*/splash.png"):
              w,h=Image.open(f).size
              Image.new("RGB",(w,h),col).save(f)
          os.makedirs(res+"/drawable-nodpi",exist_ok=True)
          Image.new("RGBA",(432,432),(0,0,0,0)).save(res+"/drawable-nodpi/splash_icon.png")
          p=res+"/values/styles.xml"
          s=open(p).read()
          s,n=re.subn(r'(<style name="AppTheme.NoActionBarLaunch"[^>]*>)',r'\1\n        <item name="windowSplashScreenBackground">'+hexc+r'</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>',s,count=1)
          open(p,"w").write(s)
          print("styles patched" if n else "styles NOT patched")
          PY
      - run: npx cap sync android
      - name: Build APK (retry if Maven is busy)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Retry $i after pause"; sleep 60; done
          exit 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SASTA STORE APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
